version: '3.8'

services:
  # Backend API server
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-latest}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: adhive-app
    restart: unless-stopped
    
    # Security: Run as non-root user (defined in Dockerfile)
    user: "1000:1000"
    
    ports:
      - "${PORT:-8080}:8080"
    
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - GO_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required in production}
      - HTTPS_ENABLED=${HTTPS_ENABLED:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_GLOBAL=${RATE_LIMIT_GLOBAL:-1000000000}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH:-1000000000}
    
    volumes:
      # Use bind mount for easy backup/restore
      - ${DATA_DIR:-./data}:/app/data:Z
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Security: Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: No privilege escalation
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Frontend development server (optional, use --profile dev)
  frontend:
    image: node:20-alpine
    container_name: adhive-frontend
    working_dir: /app
    profiles:
      - dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app
    restart: unless-stopped

networks:
  default:
    name: adhive-network
