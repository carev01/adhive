# This is the golangci-lint configuration for v2
version: "2"

# golangci-lint configuration for local development
run:
  tests: false
  modules-download-mode: readonly
  
# Linters section with enable/disable and settings
linters:
  # Only run linters that don't require type information from dependencies
  enable:
    - gosimple
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
  disable:
    - errcheck
    
  # Linter-specific settings (was linters-settings at root level)
  settings:
    misspell:
      locale: US

  # Exclusion rules (was issues.exclude-rules)
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam

# Formatters section (new in v2)
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/carev01/adhive
