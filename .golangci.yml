# This is the golangci-lint configuration for v2
version: "2"

# golangci-lint configuration for local development
run:
  tests: false
  modules-download-mode: readonly
  
# Linters section with enable/disable and settings
linters:
  enable:
    - staticcheck  # includes gosimple checks
    - ineffassign
    - unused
    - misspell
    - unconvert
    - unparam
  disable:
    - errcheck
    
  # Linter-specific settings
  settings:
    misspell:
      locale: US

  # Exclusion rules
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam

# Formatters section
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/carev01/adhive
