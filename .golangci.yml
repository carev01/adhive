# This is the golangci-lint configuration for v9+
version: 2

# golangci-lint configuration for local development
run:
  tests: false
  modules-download-mode: readonly
  
# Only run linters that don't require type information from dependencies
linters:
  enable:
    - gosimple
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
  disable:
    - typecheck
    - errcheck
    
linters-settings:
  gofmt:
    simplify: true
    
  goimports:
    local-prefixes: github.com/carev01/adhive
    
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unparam
