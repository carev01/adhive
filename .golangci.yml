# golangci-lint configuration for local development
run:
  tests: false
  modules-download-mode: readonly
  
# Only run linters that don't require type information from dependencies
linters:
  enable:
    - errcheck
    - gosimple
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
  disable:
    - typecheck
    
linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    
  gofmt:
    simplify: true
    
  goimports:
    local-prefixes: github.com/carev01/adhive
    
  misspell:
    locale: US
    
  unparam:
    algo: cha
    
  unused:
    check-generated: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
