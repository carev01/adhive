{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "adhive.fullname" . }}
  labels:
    {{- include "adhive.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "adhive.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: {{ .Values.service.port }}
  egress:
    - to:
      - namespaceSelector: {}
{{- end }}
