{{- if and .Values.persistence.enabled .Values.persistence.archives.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "adhive.archivesPVC" . }}
  labels:
    {{- include "adhive.labels" . | nindent 4 }}
    component: archives
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.archives.size | quote }}
{{- end }}
